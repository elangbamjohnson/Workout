<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Strike First — Offline</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0a0a0a;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
      padding: 24px;
      gap: 16px;
    }
    .icon {
      width: 72px;
      height: 72px;
      border-radius: 16px;
      background: #E8643A;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 8px;
    }
    h1 { font-size: 24px; font-weight: 700; }
    p { font-size: 15px; color: var(--text-muted); line-height: 1.5; max-width: 280px; }
    .retry-btn {
      margin-top: 8px;
      padding: 12px 28px;
      background: #E8643A;
      color: white;
      font-size: 15px;
      font-weight: 600;
      border: none;
      border-radius: 10px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="icon">
    <img src="./assets/boxer-icon.png" width="44" height="44"
         style="filter: brightness(0) invert(1); object-fit: contain;" alt="">
  </div>
  <h1>You're Offline</h1>
  <p>No connection detected. Connect to the internet and try again — your training data is saved locally.</p>
  <button class="retry-btn" onclick="window.location.reload()">Try Again</button>
</body>
</html>
