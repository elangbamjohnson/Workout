<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Strike First</title>
    <!-- Canonical URL -->
    <link rel="canonical" href="https://elangbamjohnson.github.io/Workout/">

    <!-- Search engines -->
    <meta name="robots" content="index, follow">
    <meta name="description" content="Strike First — free 5-day boxing power & conditioning program. Timers, video demos, audio coaching, and progress tracking. No download required.">
    <meta name="keywords" content="boxing, training, workout, punching power, conditioning, boxing app, free boxing program">
    <meta name="author" content="Johnson Elangbam">

    <!-- Open Graph (Facebook, WhatsApp, LinkedIn) -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://elangbamjohnson.github.io/Workout/">
    <meta property="og:title" content="Strike First — Strike Hard. No Mercy.">
    <meta property="og:description" content="A free 5-day boxing power & conditioning program. Timers, video demos, audio coaching, and progress tracking — built for fighters.">
    <meta property="og:image" content="https://elangbamjohnson.github.io/Workout/assets/og-image.png">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:site_name" content="Strike First">

    <!-- Twitter / X Card -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Strike First — Strike Hard. No Mercy.">
    <meta name="twitter:description" content="Free 5-day boxing power & conditioning app. Timers, video demos, audio coaching. No download. No subscription.">
    <meta name="twitter:image" content="https://elangbamjohnson.github.io/Workout/assets/og-image.png">

    <link rel="manifest" href="./manifest.json">
    <!-- PWA iOS -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Strike First">
    <link rel="apple-touch-icon" href="./assets/icon-192.png">
    <!-- Theme color for browser chrome -->
    <meta name="theme-color" content="#E8643A">
    <!-- Standard PWA meta -->
    <meta name="mobile-web-app-capable" content="yes">
    <!-- Use Google Fonts (Inter) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div id="global-header" class="global-header-wrapper"></div>
    <div id="app-container">
        <!-- Views will be dynamically injected here -->
    </div>

    <!-- Scripts -->
    <script src="data.js"></script>
    <script src="store.js"></script>
    <script src="timer.js"></script>
    <script src="app.js"></script>
    
    <div class="viewport-frame"></div>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('./sw.js')
            .then(reg => console.log('[SW] Registered:', reg.scope))
            .catch(err => console.error('[SW] Registration failed:', err));
        });
      }
    </script>
</body>
</html>
