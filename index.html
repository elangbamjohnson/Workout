<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Strike First</title>
    <meta name="description" content="Strike First — Strike Hard. No Mercy.">
    <link rel="manifest" href="./manifest.json">
    <!-- PWA iOS -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Strike First">
    <link rel="apple-touch-icon" href="./assets/icon-192.png">
    <!-- Theme color for browser chrome -->
    <meta name="theme-color" content="#E8643A">
    <!-- Standard PWA meta -->
    <meta name="mobile-web-app-capable" content="yes">
    <!-- Use Google Fonts (Inter) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div id="global-header" class="global-header-wrapper"></div>
    <div id="app-container">
        <!-- Views will be dynamically injected here -->
    </div>

    <!-- Scripts -->
    <script src="data.js"></script>
    <script src="store.js"></script>
    <script src="timer.js"></script>
    <script src="app.js"></script>
    
    <div class="viewport-frame"></div>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('./sw.js')
            .then(reg => console.log('[SW] Registered:', reg.scope))
            .catch(err => console.error('[SW] Registration failed:', err));
        });
      }
    </script>
</body>
</html>
